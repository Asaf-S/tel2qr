<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tel2QR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 28px 22px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 280px;
    }

    .title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }

    .number {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      word-break: break-all;
      text-align: center;
    }

    canvas { border-radius: 8px; }

    .hint { font-size: 12px; color: #888; text-align: center; }

    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }

    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="card">
    <p class="title">Scan to call</p>
    <p class="number" id="number"></p>
    <canvas id="qr"></canvas>
    <p class="hint">Point your phone camera at this QR code</p>
    <div class="actions">
      <button class="btn btn-secondary" id="open-btn">Open in app</button>
      <button class="btn btn-secondary" id="copy-btn">Copy number</button>
    </div>
  </div>
  <script src="dist/handler.js"></script>
</body>
</html>
